<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- PsychoGraph Signature Gradient -->
    <linearGradient id="pgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Dark Container Background -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#pgGradient)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Brain Outer Outline -->
  <path d="M 22,22 C 18,22 15,25 15,29 C 15,31 16,33 17.5,34.5 C 16,36 15,38 15,40 C 15,44 18,47 22,47 C 23.5,47 25,46.5 26,45.5 L 32,45.5 L 38,45.5 C 39,46.5 40.5,47 42,47 C 46,47 49,44 49,40 C 49,38 48,36 46.5,34.5 C 48,33 49,31 49,29 C 49,25 46,22 42,22 C 40.5,22 39,22.5 38,23.5 C 36.5,21.5 34.5,20.5 32,20.5 C 29.5,20.5 27.5,21.5 26,23.5 C 25,22.5 23.5,22 22,22 Z" 
        fill="url(#glowGrad)" stroke="url(#pgGradient)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Central Pulse Line -->
  <path d="M 22,34 L 27,34 L 29,28 L 32,40 L 35,31 L 37,34 L 42,34" 
        fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Signal Nodes -->
  <circle cx="29" cy="28" r="1.5" fill="#ffffff" />
  <circle cx="32" cy="40" r="1.5" fill="#ffffff" />
  <circle cx="35" cy="31" r="1.5" fill="#ffffff" />
</svg>
